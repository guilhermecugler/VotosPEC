        <div id="vote-count" class="vote-count"></div> <!-- Contador de votos -->

        <div class="filter-container">
            <input type="text" id="search-input" placeholder="Buscar deputado pelo nome" class="input-search">
            <select id="vote-filter" class="input-select">
                <option value="">Todos os votos</option>
                <option value="Sim">Assinou</option>
                <option value="Não">Não assinou</option>
            </select>
            <select id="group-filter" class="input-select">
                <option value="">Sem Agrupamento</option>
                <option value="partido">Agrupar por Partido</option>
                <option value="estado">Agrupar por Estado</option>
            </select>
        </div>

        <div id="deputados-container" class="deputados-grid"></div>
